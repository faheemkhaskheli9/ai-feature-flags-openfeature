[project]
name = "ai-feature-flags-openfeature"
version = "0.1.0"
description = "Feature Flag System for AI Applications"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "fakeredis>=2.20"]

[project.scripts]
ai-feature-flags = "ai_feature_flags.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
